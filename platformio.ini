; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:waveshare_esp32s3_zero_n8r8]
platform = espressif32@6.13.0
; Waveshare recommends the generic ESP32-S3-DevKitM-1 PlatformIO target.
; Explicit overrides below describe the ESP32-S3-PICO-1-N8R8 memory package.
board = esp32-s3-devkitm-1
framework = arduino

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.partitions = partitions_waveshare_n8r8.csv
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608

monitor_speed = 115200
; Use a conservative upload speed for the board's native USB connection.
upload_speed = 115200

build_flags =
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    adafruit/Adafruit GFX Library@^1.12.6
    adafruit/Adafruit ST7735 and ST7789 Library@^1.11.0
