; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:adafruit_qtpy_esp32s3_n4r2]
platform = espressif32@6.13.0
board = adafruit_qtpy_esp32s3_n4r2
framework = arduino

monitor_speed = 115200
; Use a conservative upload speed: native USB serial can time out at 921600.
upload_speed = 115200

; Use PlatformIO's board defaults so the USB 1200-baud touch/reset sequence
; places the ESP32-S3 into its flashing bootloader before upload.

build_flags =
    -D ARDUINO_USB_MODE=0
    -D ARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    adafruit/Adafruit GFX Library@^1.12.6
    adafruit/Adafruit ST7735 and ST7789 Library@^1.11.0
